<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BussUp - Sirket Ici Mesajlasma</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; background: #f0f2f5; }

    /* ===== LOGIN ===== */
    .login-container {
      display: flex; justify-content: center; align-items: center;
      height: 100vh; background: linear-gradient(135deg, #075E54 0%, #128C7E 100%);
    }
    .login-box {
      background: #fff; border-radius: 16px; padding: 40px; width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-box h1 { color: #075E54; font-size: 36px; text-align: center; margin-bottom: 4px; }
    .login-box .subtitle { color: #666; text-align: center; margin-bottom: 30px; font-size: 14px; }
    .login-box input {
      width: 100%; padding: 14px 16px; border: 1px solid #ddd; border-radius: 10px;
      font-size: 15px; margin-bottom: 12px; outline: none; transition: border 0.2s;
      background: #f9f9f9;
    }
    .login-box input:focus { border-color: #075E54; background: #fff; }
    .login-box label { font-size: 13px; font-weight: 600; color: #333; display: block; margin-bottom: 4px; }
    .btn-primary {
      width: 100%; padding: 14px; background: #075E54; color: #fff; border: none;
      border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer;
      transition: background 0.2s; margin-top: 8px;
    }
    .btn-primary:hover { background: #064e46; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-toggle { text-align: center; margin-top: 16px; color: #666; font-size: 14px; }
    .login-toggle a { color: #075E54; cursor: pointer; font-weight: 600; text-decoration: none; }
    .error-msg { color: #e74c3c; font-size: 13px; text-align: center; margin-bottom: 12px; min-height: 18px; }
    .register-fields { display: none; }
    .register-fields.show { display: block; }

    /* ===== APP LAYOUT ===== */
    .app-container { display: none; height: 100vh; }
    .app-container.active { display: flex; }

    /* Sidebar */
    .sidebar {
      width: 380px; background: #fff; border-right: 1px solid #e0e0e0;
      display: flex; flex-direction: column; height: 100vh;
    }
    .sidebar-header {
      background: #075E54; color: #fff; padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center;
      min-height: 64px;
    }
    .sidebar-header h2 { font-size: 20px; font-weight: 700; }
    .sidebar-header .user-info { font-size: 12px; opacity: 0.85; }
    .header-buttons { display: flex; gap: 8px; }
    .header-btn {
      background: rgba(255,255,255,0.15); border: none; color: #fff;
      padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
    }
    .header-btn:hover { background: rgba(255,255,255,0.25); }

    .search-box {
      padding: 10px 16px; background: #f6f6f6; border-bottom: 1px solid #eee;
    }
    .search-box input {
      width: 100%; padding: 10px 14px; border: none; border-radius: 8px;
      font-size: 14px; background: #fff; outline: none;
    }

    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item {
      display: flex; align-items: center; padding: 14px 20px; cursor: pointer;
      border-bottom: 1px solid #f0f0f0; transition: background 0.15s;
    }
    .chat-item:hover { background: #f5f5f5; }
    .chat-item.active { background: #ebebeb; }
    .chat-avatar {
      width: 48px; height: 48px; border-radius: 50%; background: #075E54;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 18px; margin-right: 14px; flex-shrink: 0;
    }
    .chat-avatar.online { box-shadow: 0 0 0 3px #fff, 0 0 0 5px #25D366; }
    .chat-info { flex: 1; min-width: 0; }
    .chat-name { font-weight: 600; font-size: 15px; color: #111; }
    .chat-preview { font-size: 13px; color: #667; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-time { font-size: 11px; color: #999; margin-left: 8px; white-space: nowrap; }
    .chat-meta { display: flex; flex-direction: column; align-items: flex-end; }
    .unread-badge {
      background: #25D366; color: #fff; border-radius: 12px; min-width: 20px;
      height: 20px; display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; margin-top: 4px; padding: 0 6px;
    }

    /* Chat Area */
    .chat-area { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    .chat-area-empty {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: #999; font-size: 16px; background: #f0f2f5;
    }

    .chat-header {
      background: #075E54; color: #fff; padding: 14px 24px;
      display: flex; align-items: center; min-height: 64px;
    }
    .chat-header .chat-avatar { width: 40px; height: 40px; font-size: 16px; margin-right: 12px; background: #128C7E; }
    .chat-header-info h3 { font-size: 16px; font-weight: 600; }
    .chat-header-info .typing-indicator { font-size: 12px; color: #b0f0e6; font-style: italic; }
    .chat-header-info .status-text { font-size: 12px; opacity: 0.8; }

    .messages-container {
      flex: 1; overflow-y: auto; padding: 20px; background: #ECE5DD;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4cfc6' fill-opacity='0.3'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .message-bubble {
      max-width: 65%; padding: 8px 12px; border-radius: 10px; margin-bottom: 6px;
      position: relative; word-wrap: break-word; line-height: 1.4;
    }
    .message-bubble.mine {
      background: #DCF8C6; align-self: flex-end; margin-left: auto;
      border-bottom-right-radius: 2px;
    }
    .message-bubble.other {
      background: #fff; align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    .message-sender { font-size: 12px; font-weight: 700; color: #075E54; margin-bottom: 2px; }
    .message-text { font-size: 14px; color: #111; }
    .message-time { font-size: 10px; color: #999; text-align: right; margin-top: 4px; }
    .message-bubble.mine .message-time { color: #7a9c78; }
    .messages-flex { display: flex; flex-direction: column; min-height: 100%; justify-content: flex-end; }

    .message-input-area {
      display: flex; align-items: flex-end; padding: 10px 16px;
      background: #f0f0f0; border-top: 1px solid #ddd;
    }
    .message-input-area textarea {
      flex: 1; padding: 12px 16px; border: none; border-radius: 20px;
      font-size: 15px; resize: none; outline: none; max-height: 120px;
      min-height: 44px; line-height: 1.4; font-family: inherit;
    }
    .send-btn {
      background: #075E54; color: #fff; border: none; border-radius: 50%;
      width: 44px; height: 44px; margin-left: 10px; cursor: pointer;
      font-size: 18px; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s; flex-shrink: 0;
    }
    .send-btn:hover { background: #064e46; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #fff; border-radius: 16px; padding: 28px; width: 420px;
      max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .modal h3 { font-size: 20px; margin-bottom: 16px; color: #075E54; }
    .modal .close-btn {
      float: right; background: none; border: none; font-size: 24px;
      cursor: pointer; color: #666; line-height: 1;
    }
    .user-list-item {
      display: flex; align-items: center; padding: 12px; border-radius: 10px;
      cursor: pointer; transition: background 0.15s; margin-bottom: 4px;
    }
    .user-list-item:hover { background: #f0f0f0; }
    .user-list-item .chat-avatar { width: 42px; height: 42px; font-size: 16px; margin-right: 12px; }
    .user-list-item .user-name { font-weight: 600; font-size: 14px; }
    .user-list-item .user-detail { font-size: 12px; color: #666; }

    .group-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none; }
    .group-input:focus { border-color: #075E54; }
    .selected-users { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .selected-tag {
      background: #e8f5e9; color: #075E54; padding: 4px 10px; border-radius: 12px;
      font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px;
    }
    .selected-tag .remove { cursor: pointer; font-weight: bold; }
    .tab-buttons { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn {
      flex: 1; padding: 10px; border: 2px solid #075E54; border-radius: 8px;
      background: #fff; color: #075E54; font-size: 14px; font-weight: 600;
      cursor: pointer; text-align: center;
    }
    .tab-btn.active { background: #075E54; color: #fff; }

    .date-divider {
      text-align: center; margin: 16px 0 8px;
    }
    .date-divider span {
      background: #e1ddd3; color: #555; padding: 4px 14px; border-radius: 8px;
      font-size: 12px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #c0c0c0; border-radius: 3px; }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-container" id="loginScreen">
  <div class="login-box">
    <h1>BussUp</h1>
    <p class="subtitle">Sirket Ici Mesajlasma</p>
    <div class="error-msg" id="loginError"></div>

    <div class="register-fields" id="registerFields">
      <label>Gorunen Ad</label>
      <input type="text" id="regName" placeholder="Adiniz Soyadiniz">
      <label>Departman</label>
      <input type="text" id="regDept" placeholder="Ornegin: Yazilim">
    </div>

    <label>Sirket E-postasi</label>
    <input type="email" id="loginEmail" placeholder="ad@sirket.com">
    <label>Sifre</label>
    <input type="password" id="loginPassword" placeholder="Sifrenizi girin">

    <button class="btn-primary" id="loginBtn" onclick="handleAuth()">Giris Yap</button>
    <div class="login-toggle">
      <span id="toggleText">Hesabiniz yok mu?</span>
      <a id="toggleLink" onclick="toggleAuthMode()">Kayit olun</a>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div class="app-container" id="appScreen">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div>
        <h2>BussUp</h2>
        <div class="user-info" id="currentUserInfo"></div>
      </div>
      <div class="header-buttons">
        <button class="header-btn" onclick="openNewChatModal()">+ Yeni</button>
        <button class="header-btn" onclick="handleLogout()">Cikis</button>
      </div>
    </div>
    <div class="search-box">
      <input type="text" placeholder="Sohbet ara..." id="chatSearch" oninput="filterChats()">
    </div>
    <div class="chat-list" id="chatList"></div>
  </div>

  <!-- Chat Area -->
  <div class="chat-area" id="chatArea">
    <div class="chat-area-empty" id="chatEmpty">
      <div style="text-align:center">
        <div style="font-size:48px;margin-bottom:16px">💬</div>
        <div style="font-size:20px;font-weight:600;color:#333;margin-bottom:8px">BussUp'a Hosgeldiniz!</div>
        <div>Sohbet baslatmak icin "+ Yeni" butonuna basin</div>
      </div>
    </div>
    <div id="activeChatArea" style="display:none;flex-direction:column;height:100%">
      <div class="chat-header" id="chatHeader"></div>
      <div class="messages-container" id="messagesContainer">
        <div class="messages-flex" id="messagesFlex"></div>
      </div>
      <div class="message-input-area">
        <textarea id="messageInput" placeholder="Mesaj yazin..." rows="1"
          onkeydown="handleInputKey(event)" oninput="handleTyping()"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<!-- NEW CHAT MODAL -->
<div class="modal-overlay" id="newChatModal">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()">&times;</button>
    <h3>Yeni Sohbet</h3>
    <div class="tab-buttons">
      <button class="tab-btn active" id="tabDirect" onclick="switchTab('direct')">Bireysel</button>
      <button class="tab-btn" id="tabGroup" onclick="switchTab('group')">Grup</button>
    </div>
    <div id="groupNameArea" style="display:none">
      <input type="text" class="group-input" id="groupNameInput" placeholder="Grup adi yazin...">
      <div class="selected-users" id="selectedUsers"></div>
    </div>
    <input type="text" class="group-input" placeholder="Kisi ara..." id="userSearch" oninput="searchUsers()">
    <div id="userList"></div>
    <button class="btn-primary" id="createGroupBtn" style="display:none" onclick="createGroup()">Grup Olustur</button>
  </div>
</div>

<script>
// ==================== STATE ====================
let token = localStorage.getItem('bussup_token');
let currentUser = null;
let socket = null;
let chats = [];
let activeChat = null;
let typingTimeout = null;
let isRegisterMode = false;
let selectedGroupUsers = [];
let chatTab = 'direct';

const API = window.location.origin + '/api';

// ==================== API HELPERS ====================
async function api(method, path, body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (token) opts.headers['Authorization'] = `Bearer ${token}`;
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(`${API}${path}`, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Hata olustu');
  return data;
}

// ==================== AUTH ====================
function toggleAuthMode() {
  isRegisterMode = !isRegisterMode;
  document.getElementById('registerFields').classList.toggle('show', isRegisterMode);
  document.getElementById('loginBtn').textContent = isRegisterMode ? 'Kayit Ol' : 'Giris Yap';
  document.getElementById('toggleText').textContent = isRegisterMode ? 'Zaten hesabiniz var mi?' : 'Hesabiniz yok mu?';
  document.getElementById('toggleLink').textContent = isRegisterMode ? 'Giris yapin' : 'Kayit olun';
  document.getElementById('loginError').textContent = '';
}

async function handleAuth() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';

  if (!email || !password) { errEl.textContent = 'E-posta ve sifre gerekli.'; return; }

  try {
    document.getElementById('loginBtn').disabled = true;
    let data;
    if (isRegisterMode) {
      const displayName = document.getElementById('regName').value.trim();
      const department = document.getElementById('regDept').value.trim();
      if (!displayName) { errEl.textContent = 'Gorunen ad zorunludur.'; document.getElementById('loginBtn').disabled = false; return; }
      data = await api('POST', '/auth/register', { email, password, displayName, department });
    } else {
      data = await api('POST', '/auth/login', { email, password });
    }
    token = data.token;
    currentUser = data.user;
    localStorage.setItem('bussup_token', token);
    showApp();
  } catch (e) {
    errEl.textContent = e.message;
  } finally {
    document.getElementById('loginBtn').disabled = false;
  }
}

async function handleLogout() {
  try { await api('POST', '/auth/logout'); } catch {}
  token = null; currentUser = null;
  localStorage.removeItem('bussup_token');
  if (socket) { socket.disconnect(); socket = null; }
  document.getElementById('appScreen').classList.remove('active');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
}

// ==================== APP INIT ====================
async function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').classList.add('active');
  document.getElementById('currentUserInfo').textContent = currentUser.displayName + ' - ' + (currentUser.department || '');

  connectSocket();
  await loadChats();
}

function connectSocket() {
  socket = io({ auth: { token }, transports: ['websocket'] });

  socket.on('connect', () => console.log('Socket baglandi'));

  socket.on('message:received', (data) => {
    if (activeChat && activeChat._id === data.chatId) {
      appendMessage(data.message);
      socket.emit('message:read', { messageId: data.message._id, chatId: data.chatId });
    }
    loadChats();
  });

  socket.on('typing:start', (data) => {
    if (activeChat && activeChat._id === data.chatId) {
      document.getElementById('typingIndicator').textContent = data.displayName + ' yaziyor...';
      document.getElementById('typingIndicator').style.display = 'block';
      document.getElementById('statusText').style.display = 'none';
    }
  });

  socket.on('typing:stop', (data) => {
    if (activeChat && activeChat._id === data.chatId) {
      document.getElementById('typingIndicator').style.display = 'none';
      document.getElementById('statusText').style.display = 'block';
    }
  });

  socket.on('user:online', (data) => {
    updateOnlineStatus(data.userId, true);
  });

  socket.on('user:offline', (data) => {
    updateOnlineStatus(data.userId, false);
  });
}

function updateOnlineStatus(userId, isOnline) {
  const avatarEl = document.querySelector(`.chat-item[data-uid="${userId}"] .chat-avatar`);
  if (avatarEl) {
    avatarEl.classList.toggle('online', isOnline);
  }
}

// ==================== CHATS ====================
async function loadChats() {
  try {
    const data = await api('GET', '/chats');
    chats = data.chats;
    renderChatList();
  } catch {}
}

function renderChatList() {
  const search = document.getElementById('chatSearch').value.toLowerCase();
  const container = document.getElementById('chatList');
  const filtered = chats.filter(c => getChatName(c).toLowerCase().includes(search));

  container.innerHTML = filtered.map(c => {
    const name = getChatName(c);
    const other = getOtherUser(c);
    const avatar = c.isGroup ? (c.name?.[0] || 'G') : (other?.displayName?.[0] || '?');
    const isOnline = other?.isOnline;
    const lastMsg = c.lastMessage ? (c.lastMessage.sender?.displayName ? c.lastMessage.sender.displayName + ': ' : '') + c.lastMessage.content : 'Henuz mesaj yok';
    const time = c.lastMessage ? formatTime(c.lastMessage.createdAt || c.updatedAt) : '';
    const isActive = activeChat && activeChat._id === c._id;
    const uid = other?._id || '';

    return `<div class="chat-item ${isActive ? 'active' : ''}" data-uid="${uid}" onclick="openChat('${c._id}')">
      <div class="chat-avatar ${isOnline ? 'online' : ''}">${avatar.toUpperCase()}</div>
      <div class="chat-info">
        <div class="chat-name">${escapeHtml(name)}</div>
        <div class="chat-preview">${escapeHtml(lastMsg)}</div>
      </div>
      <div class="chat-meta">
        <div class="chat-time">${time}</div>
      </div>
    </div>`;
  }).join('');
}

function getChatName(chat) {
  if (chat.isGroup) return chat.name;
  const other = chat.participants.find(p => p._id !== currentUser._id);
  return other?.displayName || 'Bilinmeyen';
}

function getOtherUser(chat) {
  if (chat.isGroup) return null;
  return chat.participants.find(p => p._id !== currentUser._id);
}

function filterChats() { renderChatList(); }

// ==================== OPEN CHAT ====================
async function openChat(chatId) {
  const chat = chats.find(c => c._id === chatId);
  if (!chat) return;
  activeChat = chat;

  document.getElementById('chatEmpty').style.display = 'none';
  document.getElementById('activeChatArea').style.display = 'flex';

  const name = getChatName(chat);
  const other = getOtherUser(chat);
  const avatar = chat.isGroup ? (chat.name?.[0] || 'G') : (other?.displayName?.[0] || '?');
  const statusText = chat.isGroup
    ? chat.participants.map(p => p.displayName).join(', ')
    : (other?.isOnline ? 'Cevrimici' : 'Son gorulme: ' + formatTime(other?.lastSeen));

  document.getElementById('chatHeader').innerHTML = `
    <div class="chat-avatar">${avatar.toUpperCase()}</div>
    <div class="chat-header-info">
      <h3>${escapeHtml(name)}</h3>
      <div class="status-text" id="statusText">${escapeHtml(statusText)}</div>
      <div class="typing-indicator" id="typingIndicator" style="display:none"></div>
    </div>`;

  // Load messages
  try {
    const data = await api('GET', `/chats/${chatId}/messages`);
    const flex = document.getElementById('messagesFlex');
    flex.innerHTML = '';
    data.messages.forEach(m => appendMessage(m));
    scrollToBottom();
  } catch {}

  socket.emit('chat:join', chatId);
  renderChatList();
  document.getElementById('messageInput').focus();
}

function appendMessage(msg) {
  const flex = document.getElementById('messagesFlex');
  const isMine = msg.sender?._id === currentUser._id;
  const senderName = msg.sender?.displayName || 'Bilinmeyen';

  const div = document.createElement('div');
  div.className = `message-bubble ${isMine ? 'mine' : 'other'}`;
  div.innerHTML = `
    ${!isMine && activeChat?.isGroup ? `<div class="message-sender">${escapeHtml(senderName)}</div>` : ''}
    <div class="message-text">${escapeHtml(msg.content)}</div>
    <div class="message-time">${formatTime(msg.createdAt)}${isMine ? ' ✓' : ''}</div>`;
  flex.appendChild(div);
  scrollToBottom();
}

function scrollToBottom() {
  const container = document.getElementById('messagesContainer');
  setTimeout(() => { container.scrollTop = container.scrollHeight; }, 50);
}

// ==================== SEND MESSAGE ====================
function sendMessage() {
  const input = document.getElementById('messageInput');
  const content = input.value.trim();
  if (!content || !activeChat) return;

  input.value = '';
  input.style.height = 'auto';
  socket.emit('typing:stop', { chatId: activeChat._id });

  socket.emit('message:send', {
    chatId: activeChat._id, content, type: 'text',
  }, (response) => {
    if (response.message) {
      appendMessage(response.message);
      loadChats();
    }
  });
}

function handleInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  // Auto-resize
  const el = e.target;
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleTyping() {
  if (!activeChat) return;
  socket.emit('typing:start', { chatId: activeChat._id });
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => {
    socket.emit('typing:stop', { chatId: activeChat._id });
  }, 2000);
}

// ==================== NEW CHAT MODAL ====================
function openNewChatModal() {
  document.getElementById('newChatModal').classList.add('active');
  selectedGroupUsers = [];
  document.getElementById('groupNameInput').value = '';
  document.getElementById('userSearch').value = '';
  switchTab('direct');
  searchUsers();
}

function closeModal() {
  document.getElementById('newChatModal').classList.remove('active');
}

function switchTab(tab) {
  chatTab = tab;
  document.getElementById('tabDirect').classList.toggle('active', tab === 'direct');
  document.getElementById('tabGroup').classList.toggle('active', tab === 'group');
  document.getElementById('groupNameArea').style.display = tab === 'group' ? 'block' : 'none';
  document.getElementById('createGroupBtn').style.display = tab === 'group' ? 'block' : 'none';
  selectedGroupUsers = [];
  renderSelectedUsers();
  searchUsers();
}

async function searchUsers() {
  const search = document.getElementById('userSearch').value;
  try {
    const data = await api('GET', `/users?search=${encodeURIComponent(search)}`);
    const container = document.getElementById('userList');
    container.innerHTML = data.users.map(u => {
      const isSelected = selectedGroupUsers.find(s => s._id === u._id);
      return `<div class="user-list-item" onclick="${chatTab === 'direct' ? `startDirectChat('${u._id}','${escapeHtml(u.displayName)}')` : `toggleGroupUser('${u._id}','${escapeHtml(u.displayName)}')`}" style="${isSelected ? 'background:#e8f5e9' : ''}">
        <div class="chat-avatar ${u.isOnline ? 'online' : ''}">${u.displayName[0].toUpperCase()}</div>
        <div>
          <div class="user-name">${escapeHtml(u.displayName)}</div>
          <div class="user-detail">${escapeHtml(u.email)} ${u.department ? '· ' + escapeHtml(u.department) : ''}</div>
        </div>
      </div>`;
    }).join('');
  } catch {}
}

async function startDirectChat(userId, displayName) {
  try {
    const data = await api('POST', '/chats/direct', { userId });
    closeModal();
    await loadChats();
    openChat(data.chat._id);
  } catch (e) { alert(e.message); }
}

function toggleGroupUser(userId, displayName) {
  const idx = selectedGroupUsers.findIndex(u => u._id === userId);
  if (idx >= 0) selectedGroupUsers.splice(idx, 1);
  else selectedGroupUsers.push({ _id: userId, displayName });
  renderSelectedUsers();
  searchUsers();
}

function renderSelectedUsers() {
  document.getElementById('selectedUsers').innerHTML = selectedGroupUsers.map(u =>
    `<span class="selected-tag">${escapeHtml(u.displayName)} <span class="remove" onclick="toggleGroupUser('${u._id}','${escapeHtml(u.displayName)}')">&times;</span></span>`
  ).join('');
}

async function createGroup() {
  const name = document.getElementById('groupNameInput').value.trim();
  if (!name) { alert('Grup adi gerekli'); return; }
  if (selectedGroupUsers.length < 1) { alert('En az 1 kisi secin'); return; }
  try {
    const data = await api('POST', '/chats/group', { name, participantIds: selectedGroupUsers.map(u => u._id) });
    closeModal();
    await loadChats();
    openChat(data.chat._id);
  } catch (e) { alert(e.message); }
}

// ==================== HELPERS ====================
function formatTime(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) {
    return d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  }
  return d.toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit' });
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ==================== STARTUP ====================
(async function init() {
  if (token) {
    try {
      const data = await api('GET', '/auth/me');
      currentUser = data.user;
      showApp();
    } catch {
      localStorage.removeItem('bussup_token');
      token = null;
    }
  }
})();
</script>
